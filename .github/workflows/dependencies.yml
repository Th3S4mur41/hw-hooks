# This is the workflow to automatically approve and merge dependabot PRs
#
name: Dependencies

on:
  # Allows you to call this workflow from other workflows
  workflow_call:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  dependency-review:
    name: "⛓️ Dependency Review"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🛡️ Dependency Review"
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
