# This is the workflow to trigger a release
#
name: Semantic release

on:
  # Allows you to call this workflow from other workflows
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false
    outputs:
      version:
        description: The newly released version
        value: ${{ jobs.release.outputs.version }}

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  release:
    name: '🏷️ Semantic Release'
    runs-on: ubuntu-latest

    permissions:
      attestations: write
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write

    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.npm-release.outputs.version }}

    outputs:
      version: ${{ steps.npm-release.outputs.version }}

    steps:
      - name: '☁️ Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: '⚙️ Use Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: '⛓️ Install dependencies'
        env:
          HUSKY: 0
        run: npm ci --no-audit --prefer-offline --progress=false

      - name: '📦 Release'
        id: npm-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }} # Needed to push to GitHub
          DOCKER_REGISTRY_USER: ${{ github.actor }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0 # disable pre-commit hooks
          # workflow_run always sets GITHUB_REF/GITHUB_SHA to the default branch, not the branch being released;
          # override them so semantic-release detects the branch actually checked out above.
          GITHUB_REF: refs/heads/${{ github.event.workflow_run.head_branch || github.base_ref }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          GITHUB_REF=refs/heads/${{ github.event.workflow_run.head_branch || github.base_ref }} # set the branch to release
          npm run release
          echo "version=$(npm run env | grep npm_package_version | cut -d '=' -f 2)" >> $GITHUB_OUTPUT
          echo "package_name=$(npm run env | grep npm_package_name | cut -d '=' -f 2)" >> $GITHUB_OUTPUT

      - name: '✍️ Attest'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: steps.npm-release.outputs.docker_image_sha_long != ''
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.npm-release.outputs.package_name }}
          subject-digest: sha256:${{ steps.npm-release.outputs.docker_image_sha_long }}
          push-to-registry: true
